<circle cx="402" cy="80" r="6"><title>Self Service, May: 2</title></circle>
<circle cx="445" cy="120" r="6"><title>Reliability, May: 2 to 3</title></circle>
<circle cx="316" cy="160" r="6"><title>Continuous Integration, May: 1</title></circle>
