{{ define "main" }}
<!-- BeOS Desktop -->
<div class="beos-desktop">
  <!-- BeOS Window -->
  <div class="beos-window">
    <!-- Title Bar with Yellow Tab -->
    <div class="beos-titlebar">
      <div class="beos-tab">
        <span class="beos-title">{{ .Title }}</span>
        <div class="beos-buttons">
          <button class="beos-button minimize">_</button>
          <button class="beos-button zoom">+</button>
          <button class="beos-button close" onclick="window.history.back()">×</button>
        </div>
      </div>
    </div>

    <!-- Menu Bar -->
    <div class="beos-menubar">
      <div class="beos-menu-item" id="nav-menu">
        Navigation
        <div class="beos-dropdown" id="nav-dropdown">
          <a href="/" class="beos-menu-link">🏠 Home</a>
          <a href="/posts/" class="beos-menu-link">📝 Blog</a>
          <a href="/projects/" class="beos-menu-link">🔧 Projects</a>
          <a href="/resume/" class="beos-menu-link">📄 Resume</a>
          <a href="/contact/" class="beos-menu-link active">📧 Contact</a>
        </div>
      </div>
      <span class="beos-menu-item">Help</span>
    </div>

    <!-- Toolbar -->
    <div class="beos-toolbar">
      <button class="beos-tool-button" onclick="window.history.back()">
        <span class="tool-icon">⬅</span>
        <span class="tool-label">Back</span>
      </button>
      <button class="beos-tool-button" onclick="window.location.href='/'">
        <span class="tool-icon">🏠</span>
        <span class="tool-label">Home</span>
      </button>
      <div class="beos-separator"></div>
      <div class="beos-location">
        <span class="location-label">Location:</span>
        <span class="location-path">/boot/home/contact</span>
      </div>
    </div>

    <!-- Content Area -->
    <div class="beos-content">
      <div class="beos-icon-bar">
        <a href="/" class="beos-nav-icon">
          <div class="nav-icon-image">🏠</div>
          <div class="nav-icon-label">Home</div>
        </a>
        <a href="/posts/" class="beos-nav-icon">
          <div class="nav-icon-image">📝</div>
          <div class="nav-icon-label">Blog</div>
        </a>
        <a href="/projects/" class="beos-nav-icon">
          <div class="nav-icon-image">🔧</div>
          <div class="nav-icon-label">Projects</div>
        </a>
        <a href="/resume/" class="beos-nav-icon">
          <div class="nav-icon-image">📄</div>
          <div class="nav-icon-label">Resume</div>
        </a>
        <a href="/contact/" class="beos-nav-icon active">
          <div class="nav-icon-image">📧</div>
          <div class="nav-icon-label">Contact</div>
        </a>
      </div>

      <div class="beos-main-content">
        <article class="beos-article">
          {{ .Content }}
        </article>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="beos-statusbar">
      <span>{{ .WordCount }} words</span>
      <span class="status-divider">|</span>
      <span>{{ .ReadingTime }} min read</span>
    </div>
  </div>

  <!-- BeOS Deskbar -->
  <div class="beos-deskbar">
    <div class="deskbar-left">
      <div class="deskbar-leaf">🍃</div>
      <span class="deskbar-label">BeOS</span>
    </div>
    <div class="deskbar-center">
      <div class="deskbar-app active">
        <span class="app-icon">📧</span>
        <span class="app-label">Contact</span>
      </div>
    </div>
    <div class="deskbar-right">
      <span class="deskbar-clock" id="beos-clock"></span>
    </div>
  </div>
</div>

<script>
// BeOS clock
function updateBeOSClock() {
  const now = new Date();
  const time = now.toLocaleTimeString('en-US', { 
    hour: 'numeric', 
    minute: '2-digit',
    hour12: true 
  });
  const date = now.toLocaleDateString('en-US', { 
    month: 'short', 
    day: 'numeric' 
  });
  document.getElementById('beos-clock').textContent = `${date} ${time}`;
}
updateBeOSClock();
setInterval(updateBeOSClock, 1000);

// Navigation menu dropdown
const navMenu = document.getElementById('nav-menu');
const navDropdown = document.getElementById('nav-dropdown');

navMenu.addEventListener('click', (e) => {
  e.stopPropagation();
  navDropdown.classList.toggle('visible');
});

document.addEventListener('click', () => {
  navDropdown.classList.remove('visible');
});
</script>

<style>
